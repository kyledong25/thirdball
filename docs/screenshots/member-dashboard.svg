<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Third Ball member dashboard</title>
  <desc id="description">Member dashboard showing a personal profile, paid dues, rating history, and event sign-up.</desc>
  <defs>
    <linearGradient id="maroon" x1="0" x2="1"><stop stop-color="#500000"/><stop offset="1" stop-color="#360000"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#500000" flood-opacity=".1"/></filter>
    <style>.label{font:700 13px Arial,sans-serif;letter-spacing:2px;fill:#705f61}.title{font:700 30px Arial,sans-serif;fill:#261c1d}.copy{font:500 15px Arial,sans-serif;fill:#705f61}.small{font:700 13px Arial,sans-serif;fill:#705f61}.white{font:700 18px Arial,sans-serif;fill:#fff}.cardtitle{font:700 21px Arial,sans-serif;fill:#261c1d}</style>
  </defs>
  <rect width="1440" height="900" fill="#f8f4ef"/>
  <rect width="1440" height="88" fill="url(#maroon)"/>
  <circle cx="52" cy="44" r="27" fill="none" stroke="#fff4e6" stroke-width="2"/><text x="52" y="50" text-anchor="middle" class="white" font-size="12">TT</text>
  <text x="95" y="33" fill="#f3d8d1" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">TEXAS A&amp;M UNIVERSITY · COLLEGE STATION</text><text x="95" y="62" class="white" font-size="25">TAMU Table Tennis</text>
  <rect x="1160" y="24" width="112" height="40" rx="7" fill="none" stroke="#b88684"/><text x="1216" y="50" text-anchor="middle" class="white" font-size="14">Refresh</text><rect x="1290" y="24" width="108" height="40" rx="7" fill="none" stroke="#b88684"/><text x="1344" y="50" text-anchor="middle" class="white" font-size="14">Sign out</text>
  <text x="58" y="142" class="label">MEMBER EVENT DESK</text><text x="58" y="186" class="title" font-size="40">Your next time at the table.</text><text x="58" y="216" class="copy">Browse upcoming practices and tournaments, then sign yourself up with one click.</text>
  <g filter="url(#shadow)"><rect x="58" y="258" width="604" height="350" rx="10" fill="#fffdfb"/><rect x="684" y="258" width="698" height="350" rx="10" fill="#fffdfb"/><rect x="58" y="630" width="644" height="215" rx="10" fill="#fffdfb"/><rect x="724" y="630" width="658" height="215" rx="10" fill="#fffdfb"/></g>
  <text x="84" y="295" class="label">YOUR CLUB PROFILE</text><text x="84" y="327" class="cardtitle">Member details</text><rect x="554" y="288" width="82" height="26" rx="13" fill="#e1f5ed"/><text x="595" y="305" text-anchor="middle" fill="#177253" font-family="Arial,sans-serif" font-size="12" font-weight="700">Dues paid</text>
  <text x="84" y="366" class="copy" font-size="13">Keep your class year, experience, and contact number current.</text><text x="84" y="407" class="small">GRADUATION YEAR</text><rect x="84" y="420" width="250" height="44" rx="6" fill="#fff" stroke="#d6dde1"/><text x="100" y="448" fill="#261c1d" font-family="Arial,sans-serif" font-size="15" font-weight="700">2027</text><text x="360" y="407" class="small">SKILL LEVEL</text><rect x="360" y="420" width="250" height="44" rx="6" fill="#fff" stroke="#d6dde1"/><text x="376" y="448" fill="#261c1d" font-family="Arial,sans-serif" font-size="15" font-weight="700">Competitive</text><text x="84" y="500" class="small">PHONE</text><rect x="84" y="513" width="526" height="44" rx="6" fill="#fff" stroke="#d6dde1"/><text x="100" y="541" fill="#261c1d" font-family="Arial,sans-serif" font-size="15" font-weight="700">(979) 555-0101</text><rect x="84" y="568" width="120" height="28" rx="6" fill="#e7d5bc"/><text x="144" y="587" text-anchor="middle" fill="#42292a" font-family="Arial,sans-serif" font-size="13" font-weight="700">Save profile</text>
  <text x="710" y="295" class="label">MEMBER RATING HISTORY</text><text x="710" y="327" class="cardtitle">My ladder progress</text><rect x="1298" y="286" width="58" height="34" rx="8" fill="#500000"/><text x="1327" y="309" text-anchor="middle" class="white">1584</text>
  <line x1="758" y1="394" x2="1338" y2="394" stroke="#eadfda"/><line x1="758" y1="469" x2="1338" y2="469" stroke="#eadfda"/><line x1="758" y1="544" x2="1338" y2="544" stroke="#eadfda"/><text x="710" y="398" class="small">1601</text><text x="710" y="473" class="small">1542</text><text x="710" y="548" class="small">1483</text><polyline points="760,522 900,510 1040,497 1180,425 1330,411" fill="none" stroke="#500000" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><g fill="#238563" stroke="#fff" stroke-width="3"><circle cx="760" cy="522" r="6"/><circle cx="900" cy="510" r="6"/><circle cx="1040" cy="497" r="6"/><circle cx="1180" cy="425" r="6"/><circle cx="1330" cy="411" r="6"/></g><text x="758" y="580" class="small">Mar 12</text><text x="1290" y="580" class="small">Jul 20</text><circle cx="1000" cy="591" r="4" fill="#238563"/><text x="1010" y="595" class="small">Win</text><circle cx="1075" cy="591" r="4" fill="#a53b36"/><text x="1085" y="595" class="small">Loss</text>
  <text x="84" y="666" class="label">PRACTICE SCHEDULE</text><text x="84" y="697" class="cardtitle">Upcoming practices</text><rect x="578" y="662" width="96" height="26" rx="13" fill="#f0f3f7"/><text x="626" y="679" text-anchor="middle" class="small">2 upcoming</text><line x1="84" y1="716" x2="676" y2="716" stroke="#e7dad4"/><text x="84" y="744" fill="#261c1d" font-family="Arial,sans-serif" font-size="16" font-weight="700">Wednesday Open Practice</text><text x="84" y="768" class="copy" font-size="13">Aug 5 · Rec Center 201 · 18/40 registered</text><rect x="562" y="735" width="96" height="34" rx="7" fill="#500000"/><text x="610" y="757" text-anchor="middle" class="white" font-size="13">Sign up</text><text x="84" y="810" fill="#261c1d" font-family="Arial,sans-serif" font-size="16" font-weight="700">Friday Training Night</text><text x="84" y="832" class="copy" font-size="13">Aug 7 · Polo Road Rec Center · 21/32 registered</text>
  <text x="750" y="666" class="label">TOURNAMENT CALENDAR</text><text x="750" y="697" class="cardtitle">Upcoming tournaments</text><rect x="1260" y="662" width="96" height="26" rx="13" fill="#f0f3f7"/><text x="1308" y="679" text-anchor="middle" class="small">1 upcoming</text><line x1="750" y1="716" x2="1356" y2="716" stroke="#e7dad4"/><text x="750" y="751" fill="#261c1d" font-family="Arial,sans-serif" font-size="17" font-weight="700">Aggie Fall Open</text><text x="750" y="777" class="copy" font-size="13">Aug 16 · Rec Center 201 · 12/32 registered</text><rect x="1245" y="742" width="96" height="34" rx="7" fill="#500000"/><text x="1293" y="764" text-anchor="middle" class="white" font-size="13">Sign up</text><text x="750" y="823" class="copy" font-size="13">Your shared club calendar appears below with all practice and tournament events.</text>
</svg>

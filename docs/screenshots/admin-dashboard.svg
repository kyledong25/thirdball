<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">Third Ball administrator dashboard</title>
  <desc id="description">Administrator dashboard showing club metrics, ladder management, and tournament operations.</desc>
  <defs>
    <linearGradient id="maroon" x1="0" x2="1"><stop stop-color="#500000"/><stop offset="1" stop-color="#360000"/></linearGradient>
    <filter id="shadow"><feDropShadow dx="0" dy="5" stdDeviation="9" flood-color="#500000" flood-opacity=".1"/></filter>
    <style>.label{font:700 13px Arial,sans-serif;letter-spacing:2px;fill:#705f61}.title{font:700 30px Arial,sans-serif;fill:#261c1d}.copy{font:500 16px Arial,sans-serif;fill:#705f61}.small{font:700 14px Arial,sans-serif;fill:#705f61}.nav{font:700 16px Arial,sans-serif;fill:#705f61}.white{font:700 18px Arial,sans-serif;fill:#fff}.number{font:700 40px Arial,sans-serif}.cardtitle{font:700 20px Arial,sans-serif;fill:#261c1d}</style>
  </defs>
  <rect width="1440" height="900" fill="#f8f4ef"/>
  <rect width="1440" height="88" fill="url(#maroon)"/>
  <circle cx="52" cy="44" r="27" fill="none" stroke="#fff4e6" stroke-width="2"/><text x="52" y="50" text-anchor="middle" class="white" font-size="12">TT</text>
  <text x="95" y="33" fill="#f3d8d1" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="2">TEXAS A&amp;M UNIVERSITY · COLLEGE STATION</text>
  <text x="95" y="62" class="white" font-size="25">TAMU Table Tennis</text>
  <rect x="1128" y="24" width="145" height="40" rx="7" fill="none" stroke="#b88684"/><text x="1200" y="50" text-anchor="middle" class="white" font-size="14">Administrator</text>
  <rect x="1290" y="24" width="108" height="40" rx="7" fill="none" stroke="#b88684"/><text x="1344" y="50" text-anchor="middle" class="white" font-size="14">Sign out</text>
  <rect x="0" y="88" width="246" height="812" fill="#fdfaf6"/><rect x="16" y="117" width="214" height="46" rx="8" fill="#fff" filter="url(#shadow)"/>
  <circle cx="39" cy="140" r="5" fill="#261c1d"/><text x="58" y="146" class="nav" fill="#500000">Aggie Overview</text>
  <circle cx="39" cy="194" r="5" fill="#238563"/><text x="58" y="200" class="nav">Club Calendar</text>
  <circle cx="39" cy="248" r="5" fill="#500000"/><text x="58" y="254" class="nav">Aggie Ladder</text>
  <circle cx="39" cy="302" r="5" fill="#8a2e2b"/><text x="58" y="308" class="nav">Tournaments</text>
  <circle cx="39" cy="356" r="5" fill="#b5753d"/><text x="58" y="362" class="nav">Practice Nights</text>
  <rect x="17" y="684" width="213" height="150" rx="10" fill="url(#maroon)"/><text x="36" y="716" class="white" font-size="15">Gig 'em. Then serve.</text><text x="36" y="746" fill="#f2deda" font-family="Arial,sans-serif" font-size="13">Run the ladder, dues,</text><text x="36" y="766" fill="#f2deda" font-family="Arial,sans-serif" font-size="13">and every tournament</text><text x="36" y="786" fill="#f2deda" font-family="Arial,sans-serif" font-size="13">from one club desk.</text>
  <text x="296" y="145" class="label">TAMU TABLE TENNIS CLUB</text><text x="296" y="188" class="title" font-size="40">The Aggie rally desk.</text><text x="296" y="218" class="copy">Keep practices, the club ladder, and tournament play moving from one maroon-and-white home base.</text>
  <g filter="url(#shadow)"><rect x="296" y="258" width="340" height="132" rx="11" fill="#500000"/><rect x="656" y="258" width="340" height="132" rx="11" fill="#e7d5bc"/><rect x="1016" y="258" width="340" height="132" rx="11" fill="#8a2e2b"/></g>
  <text x="320" y="315" class="number" fill="#fff">4</text><text x="320" y="360" class="white" font-size="14">Active members</text>
  <text x="680" y="315" class="number" fill="#42292a">1</text><text x="680" y="360" fill="#42292a" font-family="Arial,sans-serif" font-size="14" font-weight="700">Open tournaments</text>
  <text x="1040" y="315" class="number" fill="#fff">2</text><text x="1040" y="360" class="white" font-size="14">Practice blocks</text>

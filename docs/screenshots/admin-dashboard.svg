  <g font-family="Arial,sans-serif"><circle cx="337" cy="537" r="13" fill="#e7d5bc"/><text x="337" y="542" text-anchor="middle" font-size="12" font-weight="700">1</text><circle cx="377" cy="537" r="15" fill="#f2e2df"/><text x="377" y="542" text-anchor="middle" fill="#500000" font-weight="700">M</text><text x="407" y="542" font-weight="700" fill="#261c1d">Maya Chen</text><text x="820" y="542" text-anchor="end" fill="#500000" font-weight="700">1584</text><line x1="321" y1="563" x2="870" y2="563" stroke="#e7dad4"/><circle cx="337" cy="600" r="13" fill="#e3dfdc"/><text x="337" y="605" text-anchor="middle" font-size="12" font-weight="700">2</text><circle cx="377" cy="600" r="15" fill="#f2e2df"/><text x="377" y="605" text-anchor="middle" fill="#500000" font-weight="700">J</text><text x="407" y="605" font-weight="700" fill="#261c1d">Jordan Patel</text><text x="820" y="605" text-anchor="end" fill="#500000" font-weight="700">1512</text><line x1="321" y1="626" x2="870" y2="626" stroke="#e7dad4"/><circle cx="337" cy="663" r="13" fill="#edcfbf"/><text x="337" y="668" text-anchor="middle" font-size="12" font-weight="700">3</text><circle cx="377" cy="663" r="15" fill="#f2e2df"/><text x="377" y="668" text-anchor="middle" fill="#500000" font-weight="700">A</text><text x="407" y="668" font-weight="700" fill="#261c1d">Avery Wilson</text><text x="820" y="668" text-anchor="end" fill="#500000" font-weight="700">1453</text></g>
  <text x="941" y="450" fill="#f0d3cb" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="2">NEXT UP</text><text x="941" y="486" class="white" font-size="26">Wednesday Open Practice</text><text x="941" y="520" fill="#e7d5bc" font-family="Arial,sans-serif" font-size="14" font-weight="700">Aug 5, 2026 · 6:00 PM</text><text x="941" y="547" fill="#f2ddda" font-family="Arial,sans-serif" font-size="14">Rec Center 201 · 18/40 registered</text><rect x="941" y="560" width="164" height="32" rx="6" fill="#fff"/><text x="1023" y="582" text-anchor="middle" fill="#500000" font-family="Arial,sans-serif" font-size="13" font-weight="700">Open practice board</text>
  <text x="941" y="661" class="label">TOURNAMENT DESK</text><text x="941" y="693" class="cardtitle">Aggie Fall Open</text><text x="1264" y="693" text-anchor="end" fill="#261c1d" font-family="Arial,sans-serif" font-size="14" font-weight="700">12 / 32</text><rect x="941" y="716" width="390" height="8" rx="4" fill="#eee4de"/><rect x="941" y="716" width="146" height="8" rx="4" fill="#500000"/><text x="941" y="758" class="copy" font-size="13">Generated bracket · Aug 16 · Rec Center 201</text>
</svg>

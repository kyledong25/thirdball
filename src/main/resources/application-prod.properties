# Activate on Render with SPRING_PROFILES_ACTIVE=prod.
# Required Render environment variables (store DB_PASSWORD as a secret):
#   DB_URL=jdbc:postgresql://<supabase-host>:5432/postgres?sslmode=require
#   DB_USERNAME=<supabase-connection-user>
#   DB_PASSWORD=<supabase-database-password>
#   CORS_ALLOWED_ORIGINS=https://<your-vercel-project>.vercel.app
# Render supplies PORT automatically. Do not add a path or trailing slash to
# CORS_ALLOWED_ORIGINS; it must be an origin.

# Do not allow a production deployment to silently use local development
# credentials. These placeholders make missing configuration fail at startup.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema; Hibernate must only validate it.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

# Comma-separate multiple exact browser origins if needed.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Render routes traffic to the port it assigns to the service.
server.port=${PORT:8080}

# A small connection pool and thread pool are sufficient for the club app and
# keep the free Render instance within its memory budget.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
server.tomcat.threads.max=30
server.tomcat.threads.min-spare=5

server.error.include-message=never

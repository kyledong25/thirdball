spring:
  datasource:
    # Local defaults. The prod profile requires the corresponding environment
    # variables instead of falling back to development credentials.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/thirdball}
    username: ${DB_USERNAME:thirdball}
    password: ${DB_PASSWORD:thirdball_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

server:
  error:
    include-message: always

app:
  cors:
    # Comma-separated origins; override with CORS_ALLOWED_ORIGINS in production.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  bootstrap-admin:
    # Local development can opt in with environment variables; production uses
    # the same variables through application-prod.properties.
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

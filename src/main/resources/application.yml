spring:
  datasource:
    # Local defaults. The prod profile requires the corresponding environment
    # variables instead of falling back to development credentials.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/thirdball}
    username: ${DB_USERNAME:thirdball}
    password: ${DB_PASSWORD:thirdball_dev}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:
    # Configure these through the MAIL_* environment variables in production.
    # Local development starts without a mail provider, but registration will
    # require a reachable SMTP service before a verification email can be sent.
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLED:true}

server:
  error:
    include-message: always

app:
  cors:
    # Comma-separated origins; override with CORS_ALLOWED_ORIGINS in production.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}
  bootstrap-admin:
    # Local development can opt in with environment variables; production uses
    # the same variables through application-prod.properties.
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  email:
    from: ${MAIL_FROM:no-reply@thirdball.local}
    verification:
      code-expiration-minutes: ${EMAIL_VERIFICATION_CODE_EXPIRATION_MINUTES:15}
      resend-cooldown-seconds: ${EMAIL_VERIFICATION_RESEND_COOLDOWN_SECONDS:60}
